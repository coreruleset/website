sectionText2:
  other: |
    - SQL Injection (SQLi)
    - Cross Site Scripting (XSS)
    - Local File Inclusion (LFI)
    - Remote File Inclusion (RFI)
    - PHP Code Injection
    - Java Code Injection
    - Server-Side Template Injection (SSTI)
    - HTTPoxy
    - Shellshock
    - Unix/Windows Shell Injection
    - Session Fixation
    - Scanner/Bot Detection
    - Metadata/Error Leakages

