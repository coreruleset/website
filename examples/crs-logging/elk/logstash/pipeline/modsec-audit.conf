# Logstash pipeline: ModSecurity v3 JSON audit log -> Elasticsearch
#
# Each line of the audit log is one JSON document describing one
# transaction. We keep the original document under `transaction` and add
# flat, dashboard friendly fields under `modsec`, `client`, `url`, `http`
# and `user_agent` (loosely following the Elastic Common Schema).

input {
  file {
    path => "/var/log/modsecurity/audit/modsec_audit.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-modsec-audit"
    codec => "json"
    tags => ["modsec-audit"]
  }
}

filter {
  # Lines that are not JSON (should not happen) are tagged _jsonparsefailure
  # by the codec; drop them rather than indexing garbage.
  if "_jsonparsefailure" in [tags] {
    drop { }
  }

  # ModSecurity writes the transaction time in ctime format, in the local
  # time of the WAF process. The official container runs in UTC.
  date {
    match => ["[transaction][time_stamp]", "EEE MMM dd HH:mm:ss yyyy", "EEE MMM  d HH:mm:ss yyyy"]
    timezone => "UTC"
    target => "@timestamp"
  }

  # All the flattening logic lives in a small Ruby script so that it stays
  # readable; see scripts/modsec_flatten.rb.
  ruby {
    path => "/usr/share/logstash/scripts/modsec_flatten.rb"
  }

  mutate {
    remove_field => ["@version", "host", "path", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "modsec-audit-%{+YYYY.MM.dd}"
    data_stream => false
    manage_template => true
    template => "/usr/share/logstash/templates/modsec-audit.json"
    template_name => "modsec-audit"
    template_overwrite => true
    ecs_compatibility => disabled
  }
}
