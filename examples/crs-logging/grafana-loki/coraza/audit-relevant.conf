# ------------------------------------------------------------------------
# OWASP CRS logging series: audit log every transaction that scored
#
# With `SecAuditEngine RelevantOnly`, ModSecurity writes a transaction to the
# audit log when its response status matches SecAuditLogRelevantStatus OR
# when a rule with `auditlog` matched. Coraza only looks at the status. A
# request that scored at the detection paranoia level but was not blocked
# (status 200) therefore never reaches Coraza's audit log, and neither do
# the false positives you are trying to find.
#
# This rule restores the ModSecurity behaviour: in phase 5, before Coraza
# decides whether to write the audit log, it switches the audit engine on
# for this one transaction if CRS gave it any points. Transactions that did
# not score stay out of the log, as before.
#
# Load it after CRS (it is included from /opt/coraza/rules.d/). Rule IDs
# 1-99,999 are reserved for local use.
# ------------------------------------------------------------------------

SecRule TX:DETECTION_ANOMALY_SCORE "@gt 0" \
    "id:99902,\
    phase:5,\
    pass,\
    t:none,\
    nolog,\
    ctl:auditEngine=On"
