---
######################## default configuration ####################
# Your theme name
theme: "dot-org-hugo-theme"
# Title of your website (required).
title: "CRS Project"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone: "Europe/London"

enableEmoji: true
enableGitInfo: true
refLinksErrorLevel: WARNING
######################## i18n ####################
# Auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage
hasCJKLanguage: false
# Set default content directory for multilingual
contentDir: content/
# Set fallback if international version is not available
defaultContentLanguage: en
# Set the default language as the root rather than in folder i.e. don't use /en/
defaultContentLanguageInSubdir: false

######################## privacy & speed ####################
# Enable do not track, no cookies on Video embeds
privacy:
  youtube:
    privacyEnhanced: true
  vimeo:
    enableDNT: true

# Links
permalinks:
  page:
    blog: /:year:month:day/:slug/

markup:
  goldmark:
    extensions:
      extras:
        delete:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
######################## module mounts ####################
# Declaring any mount replaces Hugo's defaults, so the default project
# mounts are listed first, unchanged.
#
# The remaining mounts publish the runnable example stacks under
# examples/ as page resources of the blog posts that use them, so the
# files live in one place and each post can list them with the
# `resources` shortcode. Paths inside a bundle mirror the examples
# directory (for example `elk/compose.yaml`).
module:
  mounts:
    - source: content
      target: content
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: data
      target: data
    - source: assets
      target: assets
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes

    # CRS logging series
    - source: examples/crs-logging
      target: content/blog/2026-11-03-crs-logging-part-1-what-your-waf-is-telling-you
      includeFiles: ["generate-traffic.sh", "waf/**"]
    - source: examples/crs-logging
      target: content/blog/2026-11-10-crs-logging-part-2-elastic-stack
      includeFiles: ["generate-traffic.sh", "waf/**", "elk/**"]
    - source: examples/crs-logging
      target: content/blog/2026-11-17-crs-logging-part-3-grafana-loki
      includeFiles: ["generate-traffic.sh", "waf/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf", "grafana-loki/**"]
